<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java Quest — 手を動かして学ぶJava</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="brand" id="homeBtn" title="メインメニューに戻る">
    <span class="brand-mark">☕</span>
    <span class="brand-name">Java Quest</span>
  </button>

  <div class="overall">
    <div class="overall-bar"><div class="overall-fill" id="overallFill"></div></div>
    <span class="overall-text" id="overallText">読み込み中…</span>
  </div>

  <div class="stats">
    <span class="stat" id="statStars" title="クリアしたレッスン数">★ <b>0</b></span>
    <span class="stat" id="statStreak" title="連続で学習した日数">🔥 <b>0</b>日</span>
    <button class="ghost-btn" id="resetBtn" title="進捗をすべて消す">進捗リセット</button>
  </div>
</header>

<div class="layout">

  <!-- ── サイドバー: 章とレッスンの一覧 ───────────────────────────── -->
  <nav class="sidebar" id="sidebar" aria-label="レッスン一覧"></nav>

  <!-- ── メイン: 解説 → サンプル → 練習問題 ─────────────────────── -->
  <main class="content" id="content">
    <div class="loading" id="loading">読み込み中…</div>
  </main>

</div>

<!-- ★獲得トースト -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 章クリアのお祝い -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🎉</div>
    <h2 class="overlay-title" id="overlayTitle"></h2>
    <p class="overlay-body" id="overlayBody"></p>
    <button class="primary-btn" id="overlayBtn">次へ進む</button>
  </div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</div>

<script src="highlight.js"></script>
<script src="markdown.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Java Café — 手を動かして学ぶJava</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
  <link rel="stylesheet" href="style.css">
  <!-- 明るさの設定は本文より先に決める。app.js（末尾）だと、保存した設定が効くまでの
       一瞬だけ既定のダークが見えてしまう。 -->
  <script src="theme.js"></script>
</head>
<body>

<header class="topbar">
  <button class="menu-toggle" id="sidebarToggle" title="章メニューの表示／非表示" aria-label="章メニューを開閉" aria-expanded="false">☰</button>
  <button class="brand" id="homeBtn" title="学習ホームに戻る">
    <span class="brand-mark">☕</span>
    <span class="brand-name">Java Café</span>
  </button>

  <nav class="top-nav" aria-label="メインナビゲーション">
    <button class="top-nav-btn" id="learningBtn" type="button">📚 学習</button>
    <button class="top-nav-btn" id="cafeBtn" type="button">☕ カフェ</button>
  </nav>

  <div class="stats">
    <span class="stat stat-cafe" id="statCafe" title="カフェで使えるコイン">🪙 <b>0</b>コイン</span>
    <span class="stat" id="statStars" title="獲得したスター">★ <b>0</b></span>
    <span class="stat" id="statStreak" title="連続で学習した日数">🔥 <b>0</b>日</span>
  </div>

  <button class="theme-toggle" id="themeToggle" type="button"
          title="画面の明るさを変える" aria-label="画面の明るさを変える"
          aria-haspopup="menu" aria-expanded="false" aria-controls="themePop"></button>
</header>

<div class="layout">

  <!-- ── サイドバー: 検索 + 章とレッスンの一覧 ─────────────────────
       検索欄は骨格としてここに置く。app.js が描き替えるのは #sidebarTree だけで、
       打ちかけの語が描き直しで消えないようにするため。 -->
  <nav class="sidebar" id="sidebar" aria-label="レッスン一覧">
    <div class="side-search">
      <div class="side-search-field">
        <span class="side-search-icon" aria-hidden="true">🔍</span>
        <input class="side-search-input" id="sidebarSearch" type="search"
               placeholder="レッスンを検索" aria-label="レッスンを検索"
               autocomplete="off" spellcheck="false" enterkeyhint="go"
               role="combobox" aria-expanded="false" aria-controls="sidebarHits">
        <button class="side-search-clear" id="sidebarSearchClear" type="button"
                title="検索をやめる" aria-label="検索をやめる" hidden>×</button>
      </div>
      <p class="side-search-count" id="sidebarSearchCount" aria-live="polite"></p>
    </div>
    <div class="side-tree" id="sidebarTree"></div>
  </nav>

  <!-- ── メイン: 解説 → サンプル → 練習問題 ─────────────────────── -->
  <main class="content" id="content">
    <div class="loading" id="loading">読み込み中…</div>
  </main>

</div>

<!-- 明るさの3択。ヘッダの中ではなく body 直下に置く。
     ヘッダは z-index:40 で重なりの文脈を作ってしまうため、中に入れると
     通知（z-index:120）がこのメニューの上に出てしまう。中身は app.js が描く。 -->
<div class="theme-pop" id="themePop" role="menu" aria-label="画面の明るさ" hidden></div>

<!-- 報酬・操作結果の通知。内容は app.js がキューから1件ずつ描画する -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- 全問制覇のお祝い。章クリアは画面を塞がないよう、右上の通知の中で知らせる -->
<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <div class="overlay-emoji" id="overlayEmoji">🎉</div>
    <h2 class="overlay-title" id="overlayTitle"></h2>
    <p class="overlay-body" id="overlayBody"></p>
    <button class="primary-btn" id="overlayBtn">閉じる</button>
  </div>
</div>

<!-- 紙吹雪。お祝いの外に出してあるので、画面を塞がずに降らせられる -->
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script src="highlight.js"></script>
<script src="markdown.js"></script>
<script src="java-api.js"></script>
<script src="complete.js"></script>
<script src="editor.js"></script>
<script src="cafe-scene.js"></script>
<script src="app.js"></script>
</body>
</html>

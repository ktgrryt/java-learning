# 3製品の同じAPIをbuildし、成果物を見比べて埋めます。
# 点数を付けるのではなく、実際に出来たものを見て書いてください。
#
# 前提（この行は変更しません）
#   必須条件: Jakarta EEの実装をサーバー側が提供する構成でなければならない
constraint.implementation-provided-by-server=required

# 実行時の実装をどこから得るか。bundled（成果物に同梱）/ server（サーバーが提供）
runtime.spring=
runtime.liberty=
runtime.quarkus=

# 本番へ運ぶ成果物の形。single-jar / war / directory
artifact.spring=
artifact.liberty=
artifact.quarkus=

# 上の必須条件を先に適用すると、候補から外れる製品はどれか。
# コンマ区切りで、辞書順に書いてください（例: a,b）
decision.rejected=

# 結論の根拠。実測して確かめた成果物の中身の名前を1つ以上入れてください
# （BOOT-INF / WEB-INF / quarkus-app / server.xml など）
decision.reason=

# スレッドダンプから読み取った事実。
#
# "checkout-worker" ... BLOCKED on DeadlockDemo$StockTableLock@... owned by "restock-worker"
# "restock-worker"  ... BLOCKED on DeadlockDemo$OrderTableLock@... owned by "checkout-worker"
#
# 互いが相手の持つロックを待っている（循環待ち）。

blocked.threads=checkout-worker,restock-worker

cycle.length=2

# checkout-worker は注文テーブルを持ったまま在庫テーブルを待っている
waits.checkout-worker=StockTableLock
# restock-worker は在庫テーブルを持ったまま注文テーブルを待っている
waits.restock-worker=OrderTableLock

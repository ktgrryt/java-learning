# 実際に取ったスレッドダンプを読んで埋めます。
# 採点側はJMX（ThreadMXBean.findDeadlockedThreads）で同じ事実を測り、突き合わせます。
#
# ダンプは採点のときに `--- スレッドダンプ（詰まっている2スレッド）---` として出ます。
# 手元で見るときは README の手順で実行してください。

# 詰まっている2つのスレッド名。コンマ区切りで、辞書順に書いてください（例: a,b）
blocked.threads=

# 循環待ちに入っているスレッドの数
cycle.length=

# それぞれのスレッドが「取得を待っている」ロックのクラス名。
# ダンプに出る名前のうち、パッケージや外側クラスを除いた部分だけを書いてください
# （例: `DeadlockDemo$OrderTableLock` なら `OrderTableLock`）
waits.checkout-worker=
waits.restock-worker=

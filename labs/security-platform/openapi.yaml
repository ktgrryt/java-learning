openapi: 3.1.0
info:
  title: Greeting API
  version: 1.0.0
paths:
  /api/greeting:
    get:
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string, minLength: 1, maxLength: 20 }
      responses:
        '200':
          description: Greeting
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties: { message: { type: string } }
        '400': { description: Invalid input }
        '401': { description: Authentication required }
        '403': { description: Not authorized }
      security: [{ oauth: ['greeting:read'] }]
components:
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example/authorize
          tokenUrl: https://identity.example/token
          scopes: { 'greeting:read': Read greetings }

# 別の接続から見えることを確かめるので、コミットが必要。
# ロールバック方式では、書いた側のトランザクションの外からは何も見えない。
test.outbox-visible-from-other-connection=truncate

# 遅延させた一意制約は、コミットの瞬間に検査される。
# 「途中で一時的に重複していてもよい」ことを確かめたいので、コミットしてはいけない。
test.deferred-unique-allows-intermediate=rollback

# PostgreSQLの採番（BIGSERIAL）はトランザクションの外側で進む。
# ロールバックしても戻らないので、IDには欠番ができる。
observed.sequence-after-rollback=no

# 2つのテストに後片付けの方式を割り当て、1つの観察結果を記録します。
#
# 方式は次の2つだけです。
#
#   rollback … トランザクションを開いて検証し、最後にROLLBACKする。速いが、
#              コミットしていないので「コミット後にしか起きないこと」は検証できない。
#   truncate … 実際にCOMMITしてから検証し、後片付けにTRUNCATEする。遅いが、
#              本番と同じ経路を通る。
#
# 割り当てを間違えると、実際のPostgreSQLで**そのテストが落ちます**。
# 正解表はありません。それぞれのテストが何を確かめているのかを読んで決めてください。

# 注文と送信箱を書いたあと、**別の接続から**その2件が見えることを確かめるテスト
test.outbox-visible-from-other-connection=

# 遅延させた一意制約（DEFERRABLE INITIALLY DEFERRED）のもとで、
# トランザクションの**途中では**同じ席番号が2件あってもよいことを確かめるテスト
test.deferred-unique-allows-intermediate=

# 観察: ロールバックしたあと、BIGSERIALの採番は巻き戻りますか。
# 戻るなら yes、戻らないなら no と書いてください（実際のPostgreSQLで測った値と比べます）
observed.sequence-after-rollback=
